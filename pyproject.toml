[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mockapi"
version = "1.0.0"
description = "Fake REST API server from a JSON file — one command, zero backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
mockapi = "mockapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
